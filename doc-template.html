<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRE Calculator Documentation</title>
    <style>
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            color: #333;
            background: #fff;
        }
        h1, h2, h3 { color: #2c3e50; margin-top: 2rem; }
        h1 { border-bottom: 3px solid #3498db; padding-bottom: 0.5rem; }
        h2 { border-bottom: 1px solid #bdc3c7; padding-bottom: 0.3rem; }
        code {
            background: #f8f9fa;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: 'Monaco', 'Consolas', monospace;
        }
        pre {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 5px;
            overflow-x: auto;
            border-left: 4px solid #3498db;
        }
        a { color: #3498db; text-decoration: none; }
        a:hover { text-decoration: underline; }
        ul, ol { padding-left: 1.5rem; }
        li { margin: 0.5rem 0; }
        strong { color: #2c3e50; }
        blockquote {
            border-left: 4px solid #f39c12;
            padding-left: 1rem;
            margin: 1rem 0;
            background: #fef9e7;
            font-style: italic;
        }
        .warning {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 5px;
            padding: 1rem;
            margin: 1rem 0;
        }
        h1:target, h2:target, h3:target {
            background: #e8f4fd;
            padding: 0.5rem;
            border-radius: 5px;
            scroll-margin-top: 1rem;
        }
    </style>
</head>
<body>
{{CONTENT}}
</body>
</html>
